<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E0E12">
<title>릴스 프롬프터</title>
<style>
  :root {
    --bg: #0E0E12; --surface: #1B1B22; --line: #33333D;
    --text: #F5F5F7; --muted: #A1A1AD; --dim: rgba(255,255,255,.38);
    --now: #FFE27A; --rec: #FF3B4A;
    --panel: rgba(14,14,18,.62);
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    touch-action: manipulation; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  [hidden] { display: none !important; }

  /* 대본 쓰기 */
  #editor { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: 14px;
    padding: calc(var(--safe-t) + 22px) 16px calc(var(--safe-b) + 16px); }
  h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  #script { flex: 1; min-height: 240px; width: 100%; resize: none; padding: 16px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 18px; line-height: 1.6; }
  #script:focus { outline: 2px solid var(--now); outline-offset: -1px; }
  .row { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; min-height: 44px; }
  #clear { padding: 10px 4px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .primary { width: 100%; height: 56px; border-radius: 14px; background: var(--now); color: #17140A; font-weight: 700; font-size: 18px; }

  /* AI 기획 */
  #planner { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: 14px;
    padding: calc(var(--safe-t) + 22px) 16px calc(var(--safe-b) + 24px); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .link { min-height: 44px; padding: 8px 4px; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  .card h2 { margin: 0; font-size: 17px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
  .card a { color: var(--now); }
  .field { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 16px; line-height: 1.5; resize: none; }
  .field:focus { outline: 2px solid var(--now); outline-offset: -1px; }
  label.t { font-size: 15px; font-weight: 600; }
  .secs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .secs button { height: 44px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: 15px; }
  .secs button.on { background: var(--now); color: #17140A; border-color: var(--now); font-weight: 700; }
  details summary { min-height: 32px; font-size: 15px; font-weight: 600; cursor: pointer; }
  details[open] summary { margin-bottom: 8px; }
  .sub2 { height: 48px; width: 100%; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; }
  #ideaList { display: flex; flex-direction: column; gap: 10px; }
  .idea { text-align: left; display: block; width: 100%; padding: 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  .idea b { display: block; font-size: 17px; margin-bottom: 6px; }
  .idea q { display: block; color: var(--now); font-size: 15px; line-height: 1.5; quotes: "“" "”"; margin-bottom: 6px; }
  .idea span { display: block; color: var(--muted); font-size: 14px; line-height: 1.5; }
  #hookList { display: flex; flex-direction: column; gap: 8px; }
  .hook { text-align: left; min-height: 44px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: 15px; line-height: 1.45; }
  .scene { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; color: var(--muted); }
  .scene b { color: var(--text); font-weight: 600; margin-right: 6px; }
  .scene div { color: var(--text); margin-top: 2px; }
  .revise { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .revise button { padding: 0 14px; min-height: 48px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font-weight: 600; white-space: nowrap; }
  #start { position: sticky; bottom: calc(var(--safe-b) + 12px); }
  #busy { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; background: rgba(14,14,18,.9); text-align: center; }
  #busyText { font-size: 18px; font-weight: 600; line-height: 1.5; }
  #busy small { color: var(--muted); font-size: 14px; }
  #cancel { min-height: 44px; padding: 0 20px; border-radius: 12px; background: var(--surface); }

  /* 촬영 */
  #stage { position: fixed; inset: 0; margin: 0 auto; background: #000; overflow: hidden; }
  @media (min-aspect-ratio: 3/4) { #stage { width: 56.25dvh; } }
  #cam, #replay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #cam.mirror { transform: scaleX(-1); }
  #guide { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 46.2dvh); height: auto; pointer-events: none;
    fill: none; stroke: rgba(255,255,255,.6); stroke-width: .55; stroke-dasharray: 2.2 1.6; stroke-linecap: round; }

  #panel { position: absolute; left: 10px; right: 10px; top: calc(var(--safe-t) + 10px); border-radius: 18px; overflow: hidden;
    background: var(--panel); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  #lines { padding: 10px 12px 8px; text-align: center; font-weight: 700; letter-spacing: -.01em; }
  #lines > div { line-height: 1.45; min-height: 1.45em; white-space: nowrap; overflow: hidden; }
  #prev, #next { cursor: pointer; }
  #prev { font-size: .68em; color: var(--dim); }
  #now { color: var(--now); }
  #next { font-size: .78em; color: rgba(255,255,255,.72); }
  #hint { text-align: center; padding: 7px 16px 10px; font-size: 13px; color: rgba(255,255,255,.72); border-top: 1px solid rgba(255,255,255,.1); }

  #camInfo { position: absolute; right: 12px; bottom: calc(var(--safe-b) + 170px); font-size: 11px; color: rgba(255,255,255,.55); font-variant-numeric: tabular-nums; }
  #voiceInfo { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 154px); padding: 3px 10px; border-radius: 999px; background: rgba(0,0,0,.55); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #timer { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 118px);
    padding: 4px 12px; border-radius: 999px; background: rgba(0,0,0,.55); font-size: 15px; font-variant-numeric: tabular-nums; }
  #timer::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: var(--rec); vertical-align: 1px; }
  #count { position: absolute; inset: 0; display: grid; place-items: center; font-size: 120px; font-weight: 800; text-shadow: 0 2px 20px rgba(0,0,0,.6); pointer-events: none; }

  #controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px calc(var(--safe-b) + 14px); }
  #settings { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
  .chip { display: flex; align-items: center; height: 44px; border-radius: 12px; background: rgba(14,14,18,.66); font-size: 14px; overflow: hidden; }
  .chip button { min-width: 44px; height: 44px; padding: 0 11px; }
  .chip span { padding: 0 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip button.on { background: var(--now); color: #17140A; font-weight: 700; }
  #bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .side { justify-self: start; min-width: 56px; height: 48px; padding: 0 14px; border-radius: 12px; background: rgba(14,14,18,.66); font-size: 15px; }
  #flip { justify-self: end; }
  #record { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; }
  #record i { display: block; width: 58px; height: 58px; border-radius: 50%; background: var(--rec); transition: all .15s; }
  #record.on i { width: 28px; height: 28px; border-radius: 6px; }

  #review { position: absolute; inset: 0; background: #000; }
  #review #replay { height: calc(100% - var(--safe-b) - 146px); object-fit: contain; }
  #editBar, #editDone { position: absolute; left: 12px; right: 12px; bottom: calc(var(--safe-b) + 82px); height: 54px; display: flex; align-items: center; gap: 6px; }
  .opt { flex: 1 1 0; min-width: 0; height: 44px; border-radius: 10px; background: rgba(40,40,48,.92); color: var(--muted); font-size: 13px; line-height: 1.15; padding: 0 2px; }
  .opt.on { background: rgba(255,226,122,.18); color: var(--now); box-shadow: inset 0 0 0 1px var(--now); font-weight: 700; }
  #autoEdit { flex: 1.5 1 0; min-width: 0; height: 44px; border-radius: 10px; background: #fff; color: #111; font-weight: 700; font-size: 15px; }
  #editDone { justify-content: space-between; color: var(--muted); font-size: 14px; }
  #clipToggle { min-height: 44px; padding: 0 14px; border-radius: 10px; background: rgba(40,40,48,.92); color: var(--text); font-size: 14px; }
  #renderView { max-width: 100%; max-height: 52dvh; border-radius: 12px; background: #000; }
  #reviewBar { position: absolute; left: 12px; right: 12px; bottom: calc(var(--safe-b) + 14px); display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
  #retake { height: 56px; border-radius: 14px; background: rgba(40,40,48,.92); font-weight: 600; }

  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 210px); max-width: calc(100vw - 32px); width: max-content;
    padding: 11px 16px; border-radius: 12px; background: rgba(20,20,26,.94); color: #fff; font-size: 15px; line-height: 1.4; text-align: center; z-index: 10; }
</style>
</head>
<body>

<main id="planner">
  <header class="top">
    <div>
      <h1>릴스 프롬프터</h1>
      <p class="sub">주제만 넣으면 기획부터 대본까지 나와요.</p>
    </div>
    <button id="keyToggle" class="link" type="button">AI 연결</button>
  </header>

  <section id="keyBox" class="card" hidden>
    <h2>AI 연결</h2>
    <p><a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>에서 API 키를 만들어 한 번만 넣어 주세요. 키는 이 폰에만 저장되고, 쓴 만큼 요금이 나가요.</p>
    <input id="keyInput" class="field" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-로 시작하는 키" aria-label="API 키">
    <button id="keySave" class="primary" type="button">저장</button>
    <button id="keyDelete" class="link" type="button" hidden>이 폰에서 키 지우기</button>
  </section>

  <section class="card">
    <label class="t" for="topic">어떤 영상을 찍을까요?</label>
    <textarea id="topic" class="field" rows="3" placeholder="예: 눈썹 문신 전에 꼭 물어봐야 할 것&#10;비워 두면 AI가 주제까지 골라요."></textarea>
    <span class="t">영상 길이</span>
    <div class="secs" id="secs" role="group" aria-label="영상 길이">
      <button type="button" data-sec="15">15초</button>
      <button type="button" data-sec="30">30초</button>
      <button type="button" data-sec="45">45초</button>
      <button type="button" data-sec="60">60초</button>
    </div>
    <details>
      <summary>우리 샵 정보 (적어 두면 더 잘 맞아요)</summary>
      <textarea id="shop" class="field" rows="4" placeholder="예: 부산 서면 반영구 전문, 주 고객 30~40대, 자연 눈썹 위주, 상담은 DM으로 받아요"></textarea>
    </details>
    <button id="getIdeas" class="primary" type="button">아이디어 받기</button>
  </section>

  <section id="ideaBox" hidden>
    <div id="ideaList"></div>
    <button id="moreIdeas" class="sub2" type="button" style="margin-top:10px">다른 아이디어 더 보기</button>
  </section>

  <button id="direct" class="link" type="button" style="align-self:center">대본을 직접 쓸게요</button>
</main>

<main id="editor" hidden>
  <header class="top">
    <h1 id="editorTitle">대본</h1>
    <button id="toPlanner" class="link" type="button">아이디어로</button>
  </header>

  <section id="planBox" class="card" hidden>
    <p id="planGoal"></p>
    <details>
      <summary>장면 구성</summary>
      <div id="sceneList"></div>
    </details>
    <details>
      <summary>첫 문장 다른 후보</summary>
      <div id="hookList"></div>
    </details>
    <div class="revise">
      <input id="revision" class="field" placeholder="고칠 점 (예: 더 짧게, 더 재밌게)" aria-label="고칠 점">
      <button id="reviseBtn" type="button">다시 쓰기</button>
    </div>
  </section>

  <textarea id="script" aria-label="대본" placeholder="여기에 대본을 쓰거나 붙여넣으세요.&#10;&#10;줄을 바꾼 곳은 촬영 화면에서도 그대로 줄이 바뀌어요."></textarea>
  <div class="row"><span id="estimate">0자</span><button id="clear" type="button">지우기</button></div>
  <button id="start" class="primary" type="button" disabled>촬영 화면 열기</button>
</main>

<section id="stage" hidden>
  <video id="cam" class="mirror" autoplay playsinline muted></video>
  <svg id="guide" viewBox="0 0 100 160" aria-hidden="true">
    <ellipse cx="50" cy="55" rx="23" ry="33.5"/>
    <path d="M40 87 C40 99 30 104 20 108 C10 112 4 119 2 133"/>
    <path d="M60 87 C60 99 70 104 80 108 C90 112 96 119 98 133"/>
  </svg>

  <div id="panel">
    <div id="lines">
      <div id="prev"></div>
      <div id="now"></div>
      <div id="next"></div>
    </div>
    <div id="hint"></div>
  </div>

  <div id="camInfo" aria-hidden="true"></div>
  <div id="voiceInfo" hidden></div>
  <div id="timer" hidden>00:00</div>
  <div id="count" hidden></div>

  <div id="controls">
    <div id="settings">
      <div class="chip" role="group" aria-label="넘김 방식">
        <button data-mode="voice" type="button">음성</button>
        <button data-mode="auto" type="button">자동</button>
        <button data-mode="hand" type="button">수동</button>
      </div>
      <div class="chip"><button id="camMode" type="button">화각</button></div>
      <div class="chip" role="group" aria-label="글자 크기">
        <button id="fontDown" type="button" aria-label="글자 작게">가−</button>
        <button id="fontUp" type="button" aria-label="글자 크게">가+</button>
      </div>
      <div class="chip" id="speedChip" role="group" aria-label="자동 넘김 빠르기">
        <button id="speedDown" type="button" aria-label="느리게">−</button>
        <span id="speedLabel"></span>
        <button id="speedUp" type="button" aria-label="빠르게">+</button>
      </div>
    </div>
    <div id="bar">
      <button id="back" class="side" type="button">대본</button>
      <button id="record" type="button" aria-label="녹화 시작"><i></i></button>
      <button id="flip" class="side" type="button">카메라 전환</button>
    </div>
  </div>

  <div id="review" hidden>
    <video id="replay" controls playsinline></video>
    <div id="editBar">
      <button class="opt on" data-opt="cut" type="button">무음·NG<br>자르기</button>
      <button class="opt on" data-opt="captions" type="button">자막</button>
      <button class="opt on" data-opt="title" type="button">제목</button>
      <button id="autoEdit" type="button">자동 편집</button>
    </div>
    <div id="editDone" hidden>
      <span id="editInfo"></span>
      <button id="clipToggle" type="button">원본 보기</button>
    </div>
    <div id="reviewBar">
      <button id="retake" type="button">다시 찍기</button>
      <button id="save" class="primary" type="button">영상 저장</button>
    </div>
  </div>
</section>

<div id="toast" role="status" hidden></div>
<div id="busy" role="status" hidden>
  <div id="busyText"></div>
  <canvas id="renderView" hidden></canvas>
  <small id="busyNote"></small>
  <button id="cancel" type="button">취소</button>
</div>

<script src="matcher.js?v=9"></script>
<script src="ai.js?v=9"></script>
<script src="edit.js?v=9"></script>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('prompter.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('prompter.' + k, JSON.stringify(v)); } catch {} },
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const HINTS = {
  voice: '녹화를 시작하면 읽는 대로 넘어가요 · 위아래 줄을 눌러 옮겨요',
  auto: '일정한 빠르기로 넘어가요 · 위아래 줄을 눌러 옮겨요',
  hand: '아랫줄을 누르면 다음, 윗줄을 누르면 이전',
};

const state = {
  mode: store.get('mode', 'voice'), font: store.get('font', 28), speed: store.get('speedV2', 4.5),
  facing: 'user', phase: 'idle', pos: 0, norm: '', chunks: [], current: -1, saved: true,
};
let replayUrl = '', stream, recorder, chunks = [], recStart = 0, timerId, autoFrame, wakeLock, countToken = 0, blobUrl, savedFile;

function toast(msg, ms = 3800) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.id);
  toast.id = setTimeout(() => { t.hidden = true; }, ms);
}

/* 대본 쓰기 */
const box = $('script');
function refreshEditor() {
  const n = Matcher.normalize(box.value).length;
  $('estimate').textContent = n ? `${box.value.replace(/\s/g, '').length}자 · 읽는 데 약 ${Math.max(1, Math.round(n / 5))}초` : '0자';
  $('start').disabled = !n;
  store.set('draft', box.value);
}
box.value = store.get('draft', '');
box.addEventListener('input', refreshEditor);
$('clear').onclick = () => {
  if (box.value && !confirm('대본을 지울까요?')) return;
  box.value = ''; refreshEditor(); box.focus();
};
refreshEditor();

/* 대본 표시: 지금 읽을 줄은 항상 같은 자리에 나온다 */
function buildScript(keep) {
  const width = $('lines').clientWidth - 24;
  const max = Math.max(6, Math.floor(width / (state.font * 0.93)));
  let at = 0;
  state.chunks = Matcher.splitChunks(box.value, max).map(text => {
    const len = Matcher.normalize(text).length;
    const chunk = { text, start: at, end: at + len };
    at += len;
    return chunk;
  });
  state.norm = state.chunks.map(c => Matcher.normalize(c.text)).join('');
  if (!keep) state.pos = 0;
  state.current = -1;
  paint();
}
function currentChunk() {
  // 음성인식은 조금 늦게 들어오므로 줄 끝 한두 글자 전에 미리 넘긴다.
  const lead = c => state.mode === 'voice' ? Math.min(2, Math.floor((c.end - c.start) / 4)) : 0;
  const i = state.chunks.findIndex(c => state.pos < c.end - lead(c));
  return i < 0 ? state.chunks.length - 1 : i;
}
function paint() {
  const i = currentChunk();
  if (i === state.current) return;
  state.current = i;
  if (state.phase === 'rec') state.timeline.push({ i, t: (Date.now() - recStart) / 1000 });
  const text = n => (state.chunks[n] ? state.chunks[n].text : '');
  $('prev').textContent = text(i - 1);
  $('now').textContent = text(i);
  $('next').textContent = text(i + 1);
}
function moveTo(pos) {
  const next = clamp(pos, 0, state.norm.length);
  if (next === state.pos) return;
  state.pos = next;
  paint();
}
function jumpTo(i) {
  if (!state.chunks[i]) return;
  state.pos = state.chunks[i].start;
  speech.offset = speech.heardLength;
  paint();
}
$('prev').onclick = () => jumpTo(state.current - 1);

/* 음성으로 따라가기 */
const speech = { rec: null, active: false, failures: 0, heardLength: 0, offset: 0 };

/* 음성인식을 쓸 수 없을 때: 녹화 중인 마이크 소리로 말하는 때와 빠르기를 읽어 넘긴다 */
const level = { ctx: null, an: null, timer: 0 };

function armLevel() { // 아이폰·갤럭시는 버튼을 누른 순간에만 오디오를 켤 수 있다
  if (level.ctx || !stream) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    level.ctx = new Ctx();
    level.ctx.resume();
    level.an = level.ctx.createAnalyser();
    level.an.fftSize = 1024;

  const pacer = Matcher.createPacer();

  let last = performance.now(), carry = 0, wasTalking = false, shown = 0;
  level.timer = setInterval(() => {
    const now = performance.now();
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    level.an.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const db = 20 * Math.log10(Math.max(Math.sqrt(sum / buf.length), 1e-6));
    const r = pacer(db, dt);
    if (now - shown > 200) {
      shown = now;
      if (level.ctx.state !== 'running') { level.ctx.resume(); $('voiceInfo').textContent = '마이크 연결 중'; }
      else $('voiceInfo').textContent = `소리 ${Math.round(db)}dB · ${r.talking ? '말하는 중' : '듣는 중'}`;
    }
    carry += r.advance;
    if (carry >= 1) { const n = Math.floor(carry); carry -= n; moveTo(state.pos + n); }
    if (r.talking) wasTalking = true;
    else if (wasTalking && r.quietFor >= 0.35) {

    }

}

// 최신 크롬은 녹화 중인 마이크를 음성인식에 그대로 넘길 수 있어 충돌이 없다.
let trackSpeech = store.get('trackSpeech', null);
function detectTrackSpeech() {
  if (trackSpeech !== null || !isAndroid() || !speechApi()) return;

    const probe = new (speechApi())();
    try { probe.start({}); probe.abort(); trackSpeech = false; }
    catch (err) { trackSpeech = err instanceof TypeError; }
  } catch { trackSpeech = false; }

}

      if (trackSpeech && track) startSpeech(track);
    } else {
      startSpeech();
    }
  } catch (err) {
    setMode('auto', false);
    $('voiceInfo').hidden = true;
    toast(`소리로 따라가기를 시작하지 못해 자동 넘김으로 바꿨어요. (${err.name})`, 7000);
  }
}
function startSpeech(track) {

    if (speech.active && !speech.gotResult) fallbackToLevel('음성인식이 안 들려서 목소리 크기로 따라갈게요.');

}
function runSpeech(Api) {

  rec.onresult = e => {
    speech.failures = 0;
    speech.gotResult = true;

    $('voiceInfo').textContent = '음성인식으로 따라가는 중';
    let heard = '';
    for (let i = 0; i < e.results.length; i++) heard += e.results[i][0].transcript;
    speech.heardLength = heard.length;
    moveTo(Matcher.follow(state.norm, state.pos, Matcher.normalize(heard.slice(speech.offset))));
  };

    if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)) {

/* 일정한 빠르기로 넘기기 */
function runAuto() {
  let last = performance.now(), carry = 0;
  autoFrame = setInterval(() => {
    const now = performance.now();
    if (state.phase === 'rec' && state.mode === 'auto') {
      carry += (now - last) / 1000 * state.speed;
      if (carry >= 1) { const n = Math.floor(carry); carry -= n; moveTo(state.pos + n); }
    }
    last = now;
  }, 100);
}

/* 카메라 */
function stopCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; $('cam').srcObject = null;
}
/* 폰마다 카메라가 달라서 화각을 골라 쓸 수 있게 한다. 앞의 셋은 요청 방식, 뒤는 그 방향의 다른 렌즈. */
const SIZE_16_9 = { width: { ideal: 1920 }, height: { ideal: 1080 }, resizeMode: 'none' };
const BASE_CAM_MODES = [
  { size: SIZE_16_9 },
  { size: { width: { ideal: 1600 }, height: { ideal: 1200 }, resizeMode: 'none' } },
  { size: {} },
];
let camModes = BASE_CAM_MODES;
state.camMode = store.get('camMode', 0);

function requestFor(mode) {
  const where = mode.deviceId ? { deviceId: { exact: mode.deviceId } } : { facingMode: state.facing };
  return { ...where, frameRate: { ideal: 30 }, ...mode.size };
}
async function findLenses() {
  try {
    const word = state.facing === 'user' ? /front|전면/i : /back|rear|후면/i;
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput' && word.test(d.label));
    camModes = [...BASE_CAM_MODES, ...devices.map(d => ({ deviceId: d.deviceId, size: SIZE_16_9 }))];
  } catch { camModes = BASE_CAM_MODES; }
}
function showCamInfo() {
  const cam = $('cam');
  $('camInfo').textContent = `화각 ${state.camMode + 1}/${camModes.length} · ${cam.videoWidth}×${cam.videoHeight} · v9`;
}
async function openCamera() {
  stopCamera();

    toast('이 주소에서는 카메라를 쓸 수 없어요. https 주소로 열어 주세요.');
    return false;
  }
  if (state.camMode >= camModes.length) state.camMode = 0;
  const audio = { echoCancellation: true, noiseSuppression: true };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: requestFor(camModes[state.camMode]), audio });
  } catch (err) {
    if (err && err.name === 'NotAllowedError') { toast('카메라와 마이크를 허용해 주세요.'); return false; }
    if (state.camMode !== 0) { // 저장해 둔 화각을 못 쓰면 기본으로 돌아간다
      state.camMode = 0;
      store.set('camMode', 0);

      return openCamera();
    }

    return false;

/* 녹화 */
function pickFormat() {
  if (!window.MediaRecorder) return null;
  return ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
}
function setPhase(phase) {
  state.phase = phase;
  const busy = phase === 'count' || phase === 'rec';
  $('settings').hidden = busy;
  $('camInfo').hidden = busy;
  $('back').style.visibility = busy ? 'hidden' : 'visible';
  $('flip').style.visibility = busy ? 'hidden' : 'visible';
  $('timer').hidden = phase !== 'rec';
  $('voiceInfo').hidden = !(phase === 'rec' && state.mode === 'voice');
  $('count').hidden = phase !== 'count';
  $('record').classList.toggle('on', phase === 'rec');
  $('record').setAttribute('aria-label', phase === 'rec' ? '녹화 끝내기' : phase === 'count' ? '시작 취소' : '녹화 시작');
  $('review').hidden = phase !== 'review';
}
async function countdown() {
  const token = ++countToken;
  setPhase('count');
  for (const n of [3, 2, 1]) {
    $('count').textContent = n;
    await new Promise(r => setTimeout(r, 800));
    if (token !== countToken) return false;
  }
  return true;
}
async function beginRecording() {
  const format = pickFormat();
  if (format === null) { toast('이 브라우저는 녹화를 지원하지 않아요.'); return; }
  if (state.mode === 'voice') armLevel();
  if (!(await countdown())) { stopLevel(); return; }
  chunks = [];
  try {
    recorder = new MediaRecorder(stream, { ...(format ? { mimeType: format } : {}), videoBitsPerSecond: 8000000 });
  } catch {
    setPhase('idle'); toast('녹화를 시작하지 못했어요.'); return;
  }

  recStart = Date.now();

  setPhase('rec');
  $('timer').textContent = '00:00';
  timerId = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    $('timer').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }, 250);
  runAuto();
  // 갤럭시 크롬은 녹화와 음성인식이 마이크를 두고 충돌한다.

  const mic = stream.getAudioTracks()[0];

    if (state.phase === 'rec' && speech.active) fallbackToLevel('영상 소리를 지키려고 목소리 크기로 따라갈게요.');

}

  const type = recorder.mimeType || (chunks[0] && chunks[0].type) || 'video/mp4';
  const blob = new Blob(chunks, { type });
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = `릴스_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${type.includes('mp4') ? 'mp4' : 'webm'}`;
  state.recSec = (Date.now() - recStart) / 1000;
  savedFile = new File([blob], name, { type: type.split(';')[0] }); // 아이폰 공유는 코덱 표기가 붙으면 거부될 수 있다
  if (blobUrl) URL.revokeObjectURL(blobUrl);

  resetEdit(savedFile, blobUrl);

}
$('record').onclick = () => {

  if (!revision) { toast('어떻게 고칠지 적어 주세요.'); return; }
  const idea = planner.current.idea;
  await withAI('대본을 고치는 중이에요', async (key, signal) => {
    applyPlan(idea, await Planner.writePlan({ key, signal, idea, shop: shopBox.value, seconds: planner.seconds, previous: box.value, revision }));
    $('revision').value = '';
  });
};
$('direct').onclick = () => {
  planner.current = null;
  store.set('plan', null);
  renderPlan();
  showView('editor');
};
$('toPlanner').onclick = () => showView('planner');

renderKey(false);
renderSecs();
renderIdeas();
renderPlan();

/* 자동 편집 */
const edit = { original: null, originalUrl: '', edited: null, editedUrl: '', showing: 'original', abort: null, opts: { cut: true, captions: true, title: true } };

function showClip(which) {
  edit.showing = which;
  const file = which === 'edited' ? edit.edited : edit.original;
  const url = which === 'edited' ? edit.editedUrl : edit.originalUrl;
  savedFile = file;
  replayUrl = url;
  $('replay').src = url + '#t=0.001';
  $('clipToggle').textContent = which === 'edited' ? '원본 보기' : '편집본 보기';
}
function renderOpts() {
  document.querySelectorAll('[data-opt]').forEach(b => {
    const on = edit.opts[b.dataset.opt];
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  });
}
function resetEdit(file, url) {
  if (edit.editedUrl) URL.revokeObjectURL(edit.editedUrl);
  edit.original = file; edit.originalUrl = url;
  edit.edited = null; edit.editedUrl = ''; edit.showing = 'original';
  $('editBar').hidden = false;
  $('editDone').hidden = true;
  // 제목은 AI가 기획한 대본에만 있다.
  const hasTitle = !!(planner.current && planner.current.title);
  document.querySelector('[data-opt="title"]').hidden = !hasTitle;
  renderOpts();
}
document.querySelectorAll('[data-opt]').forEach(b => {
  b.onclick = () => { edit.opts[b.dataset.opt] = !edit.opts[b.dataset.opt]; renderOpts(); };
});
$('clipToggle').onclick = () => showClip(edit.showing === 'edited' ? 'original' : 'edited');

const SMALL_ENOUGH_TO_ANALYZE = 400 * 1024 * 1024;

async function readEnvelope(job) {
  if (edit.original.size > SMALL_ENOUGH_TO_ANALYZE) return null;
  try {
    const audio = await job.ctx.decodeAudioData(await edit.original.arrayBuffer());
    return AutoEdit.envelope(audio.getChannelData(0), audio.sampleRate);
  } catch { return null; }
}

$('autoEdit').onclick = async () => {
  const hasTitle = !document.querySelector('[data-opt="title"]').hidden;
  const { cut, captions } = edit.opts;
  const title = hasTitle && edit.opts.title ? planner.current.title : '';
  if (!cut && !captions && !title) { toast('자를지, 자막이나 제목을 넣을지 하나는 골라 주세요.'); return; }

  const job = AutoEdit.prepare(edit.originalUrl); // 버튼을 누른 순간에 시작해야 아이폰에서 소리가 난다
  const abort = edit.abort = new AbortController();
  $('replay').pause();
  $('busyText').textContent = '소리를 살펴보는 중이에요';
  $('busyNote').textContent = '화면을 켜 두고 잠시 기다려 주세요';
  $('renderView').hidden = false;
  $('busy').hidden = false;
  try {
    const env = cut ? await readEnvelope(job) : null;
    if (abort.signal.aborted) throw new DOMException('Aborted', 'AbortError');
    const plan = AutoEdit.planEdit({
      env, duration: state.recSec, timeline: state.timeline,
      texts: state.chunks.map(c => c.text), cut, captions,
    });
    const blob = await AutoEdit.render({
      job, plan, title, format: pickFormat(), canvas: $('renderView'), signal: abort.signal,
      onProgress: p => { $('busyText').textContent = `편집하는 중이에요 ${Math.round(p * 100)}%`; },
    });
    const type = blob.type.split(';')[0];
    const name = edit.original.name.replace(/\.[^.]+$/, '') + `_편집.${type.includes('mp4') ? 'mp4' : 'webm'}`;
    if (edit.editedUrl) URL.revokeObjectURL(edit.editedUrl);
    edit.edited = new File([blob], name, { type });
    edit.editedUrl = URL.createObjectURL(blob);
    state.saved = false;
    $('editBar').hidden = true;
    $('editDone').hidden = false;
    $('editInfo').textContent = `${Math.round(state.recSec)}초 → ${Math.round(plan.duration)}초` + (cut && !env ? ' · 무음은 못 잘랐어요' : '');
    showClip('edited');
  } catch (err) {
    if (err && err.name !== 'AbortError') toast('편집하지 못했어요. 원본은 그대로 있어요.', 7000);
  } finally {
    AutoEdit.dispose(job);
    $('renderView').hidden = true;
    $('busy').hidden = true;
    edit.abort = null;
  }
};
</script>
