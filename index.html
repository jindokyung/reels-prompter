<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E0E12">
<title>릴스 프롬프터</title>
<style>
  :root {
    --bg: #0E0E12; --surface: #1B1B22; --line: #33333D;
    --text: #F5F5F7; --muted: #A1A1AD; --dim: rgba(255,255,255,.38);
    --now: #FFE27A; --rec: #FF3B4A;
    --panel: rgba(14,14,18,.62);
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    touch-action: manipulation; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  [hidden] { display: none !important; }

  /* 대본 쓰기 */
  #editor { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: 14px;
    padding: calc(var(--safe-t) + 22px) 16px calc(var(--safe-b) + 16px); }
  h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  #script { flex: 1; min-height: 240px; width: 100%; resize: none; padding: 16px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 18px; line-height: 1.6; }
  #script:focus { outline: 2px solid var(--now); outline-offset: -1px; }
  .row { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; min-height: 44px; }
  #clear { padding: 10px 4px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .primary { width: 100%; height: 56px; border-radius: 14px; background: var(--now); color: #17140A; font-weight: 700; font-size: 18px; }

  /* 촬영 */
  #stage { position: fixed; inset: 0; margin: 0 auto; background: #000; overflow: hidden; }
  @media (min-aspect-ratio: 3/4) { #stage { width: 56.25dvh; } }
  #cam, #replay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #cam.mirror { transform: scaleX(-1); }
  #guide { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%, 46.2dvh); height: auto; pointer-events: none;
    fill: none; stroke: rgba(255,255,255,.6); stroke-width: .55; stroke-dasharray: 2.2 1.6; stroke-linecap: round; }

  #panel { position: absolute; left: 10px; right: 10px; top: calc(var(--safe-t) + 10px); border-radius: 18px; overflow: hidden;
    background: var(--panel); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  #lines { padding: 10px 12px 8px; text-align: center; font-weight: 700; letter-spacing: -.01em; }
  #lines > div { line-height: 1.45; min-height: 1.45em; white-space: nowrap; overflow: hidden; }
  #prev, #next { cursor: pointer; }
  #prev { font-size: .68em; color: var(--dim); }
  #now { color: var(--now); }
  #next { font-size: .78em; color: rgba(255,255,255,.72); }
  #hint { text-align: center; padding: 7px 16px 10px; font-size: 13px; color: rgba(255,255,255,.72); border-top: 1px solid rgba(255,255,255,.1); }

  #timer { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 118px);
    padding: 4px 12px; border-radius: 999px; background: rgba(0,0,0,.55); font-size: 15px; font-variant-numeric: tabular-nums; }
  #timer::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: var(--rec); vertical-align: 1px; }
  #count { position: absolute; inset: 0; display: grid; place-items: center; font-size: 120px; font-weight: 800; text-shadow: 0 2px 20px rgba(0,0,0,.6); pointer-events: none; }

  #controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px calc(var(--safe-b) + 14px); }
  #settings { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
  .chip { display: flex; align-items: center; height: 44px; border-radius: 12px; background: rgba(14,14,18,.66); font-size: 14px; overflow: hidden; }
  .chip button { min-width: 44px; height: 44px; padding: 0 11px; }
  .chip span { padding: 0 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip button.on { background: var(--now); color: #17140A; font-weight: 700; }
  #bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .side { justify-self: start; min-width: 56px; height: 48px; padding: 0 14px; border-radius: 12px; background: rgba(14,14,18,.66); font-size: 15px; }
  #flip { justify-self: end; }
  #record { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; }
  #record i { display: block; width: 58px; height: 58px; border-radius: 50%; background: var(--rec); transition: all .15s; }
  #record.on i { width: 28px; height: 28px; border-radius: 6px; }

  #review { position: absolute; inset: 0; background: #000; }
  #review #replay { height: calc(100% - var(--safe-b) - 84px); object-fit: contain; }
  #reviewBar { position: absolute; left: 12px; right: 12px; bottom: calc(var(--safe-b) + 14px); display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
  #retake { height: 56px; border-radius: 14px; background: rgba(40,40,48,.92); font-weight: 600; }

  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-b) + 210px); max-width: calc(100vw - 32px); width: max-content;
    padding: 11px 16px; border-radius: 12px; background: rgba(20,20,26,.94); color: #fff; font-size: 15px; line-height: 1.4; text-align: center; z-index: 10; }
</style>
</head>
<body>

<main id="editor">
  <header>
    <h1>릴스 프롬프터</h1>
    <p class="sub">대본을 넣으면 내 얼굴과 대본이 한 화면에 나와요.</p>
  </header>
  <textarea id="script" aria-label="대본" placeholder="여기에 대본을 쓰거나 붙여넣으세요.&#10;&#10;줄을 바꾼 곳은 촬영 화면에서도 그대로 줄이 바뀌어요."></textarea>
  <div class="row"><span id="estimate">0자</span><button id="clear" type="button">지우기</button></div>
  <button id="start" class="primary" type="button" disabled>촬영 화면 열기</button>
</main>

<section id="stage" hidden>
  <video id="cam" class="mirror" autoplay playsinline muted></video>
  <svg id="guide" viewBox="0 0 100 160" aria-hidden="true">
    <ellipse cx="50" cy="55" rx="23" ry="33.5"/>
    <path d="M40 87 C40 99 30 104 20 108 C10 112 4 119 2 133"/>
    <path d="M60 87 C60 99 70 104 80 108 C90 112 96 119 98 133"/>
  </svg>

  <div id="panel">
    <div id="lines">
      <div id="prev"></div>
      <div id="now"></div>
      <div id="next"></div>
    </div>
    <div id="hint"></div>
  </div>

  <div id="timer" hidden>00:00</div>
  <div id="count" hidden></div>

  <div id="controls">
    <div id="settings">
      <div class="chip" role="group" aria-label="넘김 방식">
        <button data-mode="voice" type="button">음성</button>
        <button data-mode="auto" type="button">자동</button>
        <button data-mode="hand" type="button">수동</button>
      </div>
      <div class="chip" role="group" aria-label="글자 크기">
        <button id="fontDown" type="button" aria-label="글자 작게">가−</button>
        <button id="fontUp" type="button" aria-label="글자 크게">가+</button>
      </div>
      <div class="chip" id="speedChip" role="group" aria-label="자동 넘김 빠르기">
        <button id="speedDown" type="button" aria-label="느리게">−</button>
        <span id="speedLabel"></span>
        <button id="speedUp" type="button" aria-label="빠르게">+</button>
      </div>
    </div>
    <div id="bar">
      <button id="back" class="side" type="button">대본</button>
      <button id="record" type="button" aria-label="녹화 시작"><i></i></button>
      <button id="flip" class="side" type="button">카메라 전환</button>
    </div>
  </div>

  <div id="review" hidden>
    <video id="replay" controls playsinline></video>
    <div id="reviewBar">
      <button id="retake" type="button">다시 찍기</button>
      <button id="save" class="primary" type="button">영상 저장</button>
    </div>
  </div>
</section>

<div id="toast" role="status" hidden></div>

<script src="matcher.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('prompter.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('prompter.' + k, JSON.stringify(v)); } catch {} },
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const HINTS = {
  voice: '읽는 대로 넘어가요 · 위아래 줄을 눌러 옮겨요',
  auto: '일정한 빠르기로 넘어가요 · 위아래 줄을 눌러 옮겨요',
  hand: '아랫줄을 누르면 다음, 윗줄을 누르면 이전',
};

const state = {
  mode: store.get('mode', 'voice'), font: store.get('font', 28), speed: store.get('speed', 6),
  facing: 'user', phase: 'idle', pos: 0, norm: '', chunks: [], current: -1, saved: true,
};
let stream, recorder, chunks = [], recStart = 0, timerId, autoFrame, wakeLock, countToken = 0, blobUrl, savedFile;

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.id);
  toast.id = setTimeout(() => { t.hidden = true; }, 3800);
}

/* 대본 쓰기 */
const box = $('script');
function refreshEditor() {
  const n = Matcher.normalize(box.value).length;
  $('estimate').textContent = n ? `${box.value.replace(/\s/g, '').length}자 · 읽는 데 약 ${Math.max(1, Math.round(n / 6))}초` : '0자';
  $('start').disabled = !n;
  store.set('draft', box.value);
}
box.value = store.get('draft', '');
box.addEventListener('input', refreshEditor);
$('clear').onclick = () => {
  if (box.value && !confirm('대본을 지울까요?')) return;
  box.value = ''; refreshEditor(); box.focus();
};
refreshEditor();

/* 대본 표시: 지금 읽을 줄은 항상 같은 자리에 나온다 */
function buildScript(keep) {
  const width = $('lines').clientWidth - 24;
  const max = Math.max(6, Math.floor(width / (state.font * 0.93)));
  let at = 0;
  state.chunks = Matcher.splitChunks(box.value, max).map(text => {
    const len = Matcher.normalize(text).length;
    const chunk = { text, start: at, end: at + len };
    at += len;
    return chunk;
  });
  state.norm = state.chunks.map(c => Matcher.normalize(c.text)).join('');
  if (!keep) state.pos = 0;
  state.current = -1;
  paint();
}
function currentChunk() {
  // 음성인식은 조금 늦게 들어오므로 줄 끝 한두 글자 전에 미리 넘긴다.
  const lead = c => state.mode === 'voice' ? Math.min(2, Math.floor((c.end - c.start) / 4)) : 0;
  const i = state.chunks.findIndex(c => state.pos < c.end - lead(c));
  return i < 0 ? state.chunks.length - 1 : i;
}
function paint() {
  const i = currentChunk();
  if (i === state.current) return;
  state.current = i;
  const text = n => (state.chunks[n] ? state.chunks[n].text : '');
  $('prev').textContent = text(i - 1);
  $('now').textContent = text(i);
  $('next').textContent = text(i + 1);
}
function moveTo(pos) {
  const next = clamp(pos, 0, state.norm.length);
  if (next === state.pos) return;
  state.pos = next;
  paint();
}
function jumpTo(i) {
  if (!state.chunks[i]) return;
  state.pos = state.chunks[i].start;
  speech.offset = speech.heardLength;
  paint();
}
$('prev').onclick = () => jumpTo(state.current - 1);
$('next').onclick = () => jumpTo(state.current + 1);

/* 설정 */
function applySettings() {
  $('lines').style.fontSize = state.font + 'px';
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === state.mode));
  $('hint').textContent = HINTS[state.mode];
  $('speedChip').hidden = state.mode !== 'auto';
  $('speedLabel').textContent = `빠르기 ${state.speed.toFixed(1)}`;
  store.set('font', state.font); store.set('speed', state.speed);
}
function setMode(mode, remember = true) {
  state.mode = mode;
  if (remember) store.set('mode', mode);
  applySettings();
}
document.querySelectorAll('[data-mode]').forEach(b => { b.onclick = () => setMode(b.dataset.mode); });
const step = (key, d, a, b) => () => { state[key] = clamp(state[key] + d, a, b); applySettings(); if (key === 'font') buildScript(true); };
$('fontDown').onclick = step('font', -3, 17, 47);
$('fontUp').onclick = step('font', 3, 17, 47);
$('speedDown').onclick = step('speed', -0.5, 2, 12);
$('speedUp').onclick = step('speed', 0.5, 2, 12);

/* 음성으로 따라가기 */
const speech = { rec: null, active: false, failures: 0, heardLength: 0, offset: 0 };
const speechApi = () => window.SpeechRecognition || window.webkitSpeechRecognition;
function fallbackToAuto(msg) {
  stopSpeech();
  setMode('auto', false);
  toast(msg);
}
function startSpeech() {
  const Api = speechApi();
  if (!Api) return;
  speech.active = true; speech.failures = 0; speech.heardLength = 0; speech.offset = 0;
  runSpeech(Api);
}
function runSpeech(Api) {
  const rec = new Api();
  speech.rec = rec;
  rec.lang = 'ko-KR'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    speech.failures = 0;
    let heard = '';
    for (let i = 0; i < e.results.length; i++) heard += e.results[i][0].transcript;
    speech.heardLength = heard.length;
    moveTo(Matcher.follow(state.norm, state.pos, Matcher.normalize(heard.slice(speech.offset))));
  };
  rec.onerror = e => {
    if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)) {
      fallbackToAuto('이 폰에서는 음성 따라가기가 안 돼서 자동 넘김으로 바꿨어요.');
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
      speech.failures++;
    }
  };
  rec.onend = () => {
    if (!speech.active) return;
    if (speech.failures >= 4) { fallbackToAuto('음성인식이 자꾸 끊겨서 자동 넘김으로 바꿨어요.'); return; }
    speech.heardLength = 0; speech.offset = 0;
    setTimeout(() => { if (speech.active) runSpeech(Api); }, 150);
  };
  try { rec.start(); } catch { speech.failures++; }
}
function stopSpeech() {
  speech.active = false;
  if (speech.rec) { try { speech.rec.abort(); } catch {} speech.rec = null; }
}

/* 일정한 빠르기로 넘기기 */
function runAuto() {
  let last = performance.now(), carry = 0;
  autoFrame = setInterval(() => {
    const now = performance.now();
    if (state.phase === 'rec' && state.mode === 'auto') {
      carry += (now - last) / 1000 * state.speed;
      if (carry >= 1) { const n = Math.floor(carry); carry -= n; moveTo(state.pos + n); }
    }
    last = now;
  }, 100);
}

/* 카메라 */
function stopCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; $('cam').srcObject = null;
}
async function openCamera() {
  stopCamera();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('이 주소에서는 카메라를 쓸 수 없어요. https 주소로 열어 주세요.');
    return false;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: state.facing, width: { ideal: 1080 }, height: { ideal: 1920 }, frameRate: { ideal: 30 } },
      audio: { echoCancellation: true, noiseSuppression: true },
    });
  } catch (err) {
    toast(err && err.name === 'NotAllowedError' ? '카메라와 마이크를 허용해 주세요.' : '카메라를 열지 못했어요.');
    return false;
  }
  const cam = $('cam');
  cam.classList.toggle('mirror', state.facing === 'user');
  cam.srcObject = stream;
  cam.play().catch(() => {});
  return true;
}
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
function letSleep() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && $('stage').hidden === false && !wakeLock) keepAwake();
});

/* 녹화 */
function pickFormat() {
  if (!window.MediaRecorder) return null;
  return ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
}
function setPhase(phase) {
  state.phase = phase;
  const busy = phase === 'count' || phase === 'rec';
  $('settings').hidden = busy;
  $('back').style.visibility = busy ? 'hidden' : 'visible';
  $('flip').style.visibility = busy ? 'hidden' : 'visible';
  $('timer').hidden = phase !== 'rec';
  $('count').hidden = phase !== 'count';
  $('record').classList.toggle('on', phase === 'rec');
  $('record').setAttribute('aria-label', phase === 'rec' ? '녹화 끝내기' : phase === 'count' ? '시작 취소' : '녹화 시작');
  $('review').hidden = phase !== 'review';
}
async function countdown() {
  const token = ++countToken;
  setPhase('count');
  for (const n of [3, 2, 1]) {
    $('count').textContent = n;
    await new Promise(r => setTimeout(r, 800));
    if (token !== countToken) return false;
  }
  return true;
}
async function beginRecording() {
  const format = pickFormat();
  if (format === null) { toast('이 브라우저는 녹화를 지원하지 않아요.'); return; }
  if (!(await countdown())) return;
  chunks = [];
  try {
    recorder = new MediaRecorder(stream, { ...(format ? { mimeType: format } : {}), videoBitsPerSecond: 8000000 });
  } catch {
    setPhase('idle'); toast('녹화를 시작하지 못했어요.'); return;
  }
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = finishRecording;
  recorder.start(1000);
  recStart = Date.now();
  setPhase('rec');
  $('timer').textContent = '00:00';
  timerId = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    $('timer').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }, 250);
  runAuto();
  if (state.mode === 'voice') startSpeech();
  // 음성인식이 마이크를 뺏어 영상 소리가 끊기면, 소리를 지키는 쪽을 택한다.
  const mic = stream.getAudioTracks()[0];
  if (mic) mic.onmute = () => {
    if (state.phase === 'rec' && speech.active) fallbackToAuto('영상 소리를 지키려고 자동 넘김으로 바꿨어요.');
  };
}
function endRecording() {
  clearInterval(timerId);
  clearInterval(autoFrame);
  stopSpeech();
  if (recorder && recorder.state !== 'inactive') recorder.stop();
}
function finishRecording() {
  clearInterval(timerId);
  clearInterval(autoFrame);
  stopSpeech();
  if (!chunks.length) { setPhase('idle'); toast('녹화된 내용이 없어요. 다시 찍어 주세요.'); return; }
  const type = recorder.mimeType || (chunks[0] && chunks[0].type) || 'video/mp4';
  const blob = new Blob(chunks, { type });
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = `릴스_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${type.includes('mp4') ? 'mp4' : 'webm'}`;
  savedFile = new File([blob], name, { type: type.split(';')[0] }); // 아이폰 공유는 코덱 표기가 붙으면 거부될 수 있다
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(blob);
  $('replay').src = blobUrl + '#t=0.001'; // 재생 전에도 첫 장면이 보이게
  state.saved = false;
  setPhase('review');
}
$('record').onclick = () => {
  if (state.phase === 'idle') beginRecording();
  else if (state.phase === 'count') { countToken++; setPhase('idle'); }
  else if (state.phase === 'rec') endRecording();
};

async function saveVideo() {
  if (!savedFile) return;
  if (navigator.canShare && navigator.canShare({ files: [savedFile] })) {
    try {
      await navigator.share({ files: [savedFile] });
      state.saved = true;
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
  }
  const a = document.createElement('a');
  a.href = blobUrl; a.download = savedFile.name;
  document.body.append(a); a.click(); a.remove();
  state.saved = true;
  toast('영상을 내려받았어요.');
}
$('save').onclick = saveVideo;
$('retake').onclick = () => {
  if (!state.saved && !confirm('저장하지 않은 영상은 사라져요. 다시 찍을까요?')) return;
  $('replay').pause(); $('replay').removeAttribute('src'); $('replay').load();
  setPhase('idle');
  buildScript(false);
};

/* 화면 전환 */
$('start').onclick = async () => {
  $('editor').hidden = true; $('stage').hidden = false;
  if (state.mode === 'voice' && !speechApi()) { setMode('auto', false); toast('이 브라우저는 음성 따라가기를 지원하지 않아 자동 넘김으로 시작해요.'); }
  applySettings();
  setPhase('idle');
  buildScript(false);
  keepAwake();
  await openCamera();
};
$('back').onclick = () => {
  stopCamera(); letSleep();
  $('stage').hidden = true; $('editor').hidden = false;
};
$('flip').onclick = async () => {
  state.facing = state.facing === 'user' ? 'environment' : 'user';
  await openCamera();
};
</script>
</body>
</html>
